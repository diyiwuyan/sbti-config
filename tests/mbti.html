<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MBTI 人格测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #0d0d0d; color: #eee; font-family: -apple-system, 'PingFang SC', sans-serif; min-height: 100vh; }
  .screen { display: none; padding: 0 24px 60px; }
  .screen.active { display: block; }

  .hero { padding: 60px 0 28px; text-align: center; }
  .hero-emoji { font-size: 72px; display: block; margin-bottom: 20px; }
  .hero-title { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 10px; }
  .hero-sub { font-size: 14px; color: #666; line-height: 1.7; }

  .intro-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; margin: 20px 0; }
  .intro-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .intro-row:last-child { margin-bottom: 0; }
  .intro-dot { width: 8px; height: 8px; border-radius: 50%; background: #ce93d8; margin-top: 6px; flex-shrink: 0; }
  .intro-text { font-size: 14px; color: #aaa; line-height: 1.6; }

  .btn-start { width: 100%; padding: 18px; background: linear-gradient(135deg, #ce93d8, #9c27b0); color: #fff; font-size: 18px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }

  .progress-bar-wrap { height: 4px; background: #1a1a1a; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #ce93d8, #9c27b0); transition: width 0.4s; }
  .q-header { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
  .q-num { font-size: 13px; color: #555; }
  .q-num span { color: #ce93d8; font-weight: 700; }
  .q-dim { font-size: 12px; color: #444; background: #1a1a1a; padding: 4px 10px; border-radius: 20px; }
  .q-body { padding: 24px 24px 20px; }
  .q-text { font-size: 17px; color: #eee; line-height: 1.7; font-weight: 600; }

  .options { display: flex; flex-direction: column; gap: 12px; padding: 0 24px 40px; }
  .opt { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 18px 20px; cursor: pointer; transition: all 0.15s; }
  .opt:active { background: #222; }
  .opt.selected { border-color: #ce93d8; background: #ce93d822; }
  .opt-label { font-size: 12px; color: #555; margin-bottom: 6px; font-weight: 700; letter-spacing: 1px; }
  .opt.selected .opt-label { color: #ce93d8; }
  .opt-text { font-size: 15px; color: #ccc; line-height: 1.5; }

  /* 结果 */
  .result-hero { text-align: center; padding: 48px 24px 24px; }
  .result-code { font-size: 52px; font-weight: 900; color: #fff; letter-spacing: 4px; margin-bottom: 8px; }
  .result-name { font-size: 22px; color: #ce93d8; font-weight: 700; margin-bottom: 6px; }
  .result-emoji { font-size: 48px; display: block; margin-bottom: 12px; }
  .result-slogan { font-size: 15px; color: #888; font-style: italic; line-height: 1.6; }

  .result-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; margin: 0 24px 16px; }
  .rc-title { font-size: 13px; font-weight: 700; color: #555; letter-spacing: 2px; margin-bottom: 14px; }
  .rc-text { font-size: 14px; color: #aaa; line-height: 1.8; }

  .dim-bars { display: flex; flex-direction: column; gap: 14px; }
  .dim-row { display: flex; flex-direction: column; gap: 6px; }
  .dim-labels { display: flex; justify-content: space-between; font-size: 12px; }
  .dim-l { color: #ce93d8; font-weight: 700; }
  .dim-r { color: #555; }
  .dim-track { height: 8px; background: #252525; border-radius: 4px; overflow: hidden; }
  .dim-fill { height: 100%; background: linear-gradient(90deg, #ce93d8, #9c27b0); border-radius: 4px; transition: width 0.8s ease; }

  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-item { background: #252525; border-radius: 10px; padding: 10px 12px; }
  .type-item.highlight { background: #ce93d822; border: 1px solid #ce93d844; }
  .type-code { font-size: 13px; font-weight: 700; color: #ce93d8; margin-bottom: 2px; }
  .type-name { font-size: 12px; color: #666; }

  .btn-retry { width: calc(100% - 48px); margin: 8px 24px 0; padding: 16px; background: #1a1a1a; border: 1px solid #333; color: #888; font-size: 16px; font-weight: 700; border-radius: 16px; cursor: pointer; }
.share-section { margin: 16px 24px 0; }
.share-section-title { font-size: 13px; color: #555; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; text-align: center; }
.share-img-wrap img { width: 100%; display: block; border-radius: 16px; }
.share-hint { text-align: center; font-size: 12px; color: #555; margin-top: 8px; }
.share-generating { text-align: center; padding: 40px 0; color: #555; font-size: 14px; }
.btn-home { width: calc(100% - 48px); margin: 12px 24px 40px; padding: 16px; background: linear-gradient(135deg, #ff6b35, #ff8c42); color: #fff; font-size: 16px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
</style>
</head>
<body>

<div class="screen active" id="screen-home">
  <div class="hero">
    <span class="hero-emoji">🧩</span>
    <div class="hero-title">MBTI 人格测试</div>
    <div class="hero-sub">Myers-Briggs 人格类型指标<br>16种人格，你是哪一种？</div>
  </div>
  <div class="intro-card">
    <div class="intro-row"><div class="intro-dot"></div><div class="intro-text">共 <strong style="color:#eee">32 道题</strong>，约 4 分钟完成</div></div>
    <div class="intro-row"><div class="intro-dot"></div><div class="intro-text">测量 <strong style="color:#eee">4个维度</strong>：E/I · S/N · T/F · J/P</div></div>
    <div class="intro-row"><div class="intro-dot"></div><div class="intro-text">得出你的 <strong style="color:#eee">4字母人格代码</strong>，如 INFP、ENTJ</div></div>
    <div class="intro-row"><div class="intro-dot"></div><div class="intro-text">凭直觉选择，没有对错之分</div></div>
  </div>
  <button class="btn-start" onclick="startTest()">开始测试</button>
</div>

<div class="screen" id="screen-test">
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="q-header">
    <div class="q-num">第 <span id="q-cur">1</span> / <span id="q-total">32</span> 题</div>
    <div class="q-dim" id="q-dim"></div>
  </div>
  <div class="q-body">
    <div class="q-text" id="q-text"></div>
  </div>
  <div class="options" id="options-wrap"></div>
</div>

<div class="screen" id="screen-result">
  <div class="result-hero">
    <span class="result-emoji" id="r-emoji"></span>
    <div class="result-code" id="r-code"></div>
    <div class="result-name" id="r-name"></div>
    <div class="result-slogan" id="r-slogan"></div>
  </div>
  <div class="result-card">
    <div class="rc-title">📊 四维倾向</div>
    <div class="dim-bars" id="dim-bars"></div>
  </div>
  <div class="result-card">
    <div class="rc-title">🧬 人格特质</div>
    <div class="rc-text" id="r-desc"></div>
  </div>
  <div class="result-card">
    <div class="rc-title">🌟 同类型名人</div>
    <div class="rc-text" id="r-famous"></div>
  </div>
  <button class="btn-retry" onclick="retry()">🔄 重新测试</button>
<div class="share-section" id="share-section">
  <div class="share-generating" id="share-generating">🎨 生成分享图中…</div>
  <div id="share-img-area" style="display:none">
    <div class="share-section-title">📸 长按图片保存到相册</div>
    <div class="share-img-wrap"><img id="share-img" src="" alt="分享图"></div>
    <div class="share-hint">长按图片 → 保存图片 → 发朋友圈</div>
  </div>
</div>
<button class="btn-home" onclick="goHome()">🏠 返回测多多</button>
</div>

<script>

  { text: '一天工作结束后，你更想？', dim: 'EI', opts: ['和朋友出去聚聚，充充电', '一个人待着，安静恢复精力'], scores: [2, 0] },
  { text: '你更喜欢哪种工作方式？', dim: 'EI', opts: ['团队协作，边讨论边推进', '独立完成，自己想清楚再说'], scores: [2, 0] },

  { text: '你做决定时更依赖？', dim: 'SN', opts: ['过去的经验和已有的数据', '直觉和对未来的预判'], scores: [2, 0] },

  // T/F 思考/情感
  { text: '朋友向你倾诉烦恼，你第一反应是？', dim: 'TF', opts: ['帮他分析问题，给出解决方案', '先共情，让他感觉被理解'], scores: [2, 0] },
  { text: '做决定时你更看重？', dim: 'TF', opts: ['逻辑和客观分析', '对人的影响和感受'], scores: [2, 0] },
  { text: '你更容易被哪种人打动？', dim: 'TF', opts: ['逻辑清晰、有理有据的人', '真诚热情、有感染力的人'], scores: [2, 0] },
  { text: '批评别人时你更倾向于？', dim: 'TF', opts: ['直接说问题，对事不对人', '先肯定再委婉提出，照顾感受'], scores: [2, 0] },

  { text: '你对"计划有变"的反应通常是？', dim: 'JP', opts: ['有点烦，打乱了节奏', '无所谓，甚至有点兴奋'], scores: [2, 0] },
  { text: '你更认同哪种说法？', dim: 'JP', opts: ['做事要有始有终，善始善终', '保持开放，不要过早下结论'], scores: [2, 0] }
]

const TYPES = {
  INTJ: { name: '建筑师', emoji: '🏛️', slogan: '我的计划，从不出错。', desc: '独立、战略性强、意志坚定。你是天生的规划者，能看到别人看不到的长远格局。对低效和无能有天然的不耐烦，但对自己认定的目标会全力以赴。', famous: '埃隆·马斯克、尼采、克里斯托弗·诺兰' },

  INFJ: { name: '提倡者', emoji: '🌿', slogan: '我只做真正有意义的事。', desc: '有远见、有原则、富有同理心。你是最稀有的人格之一，内心有强烈的使命感，对人性有深刻洞察，但容易因理想与现实的落差而疲惫。', famous: '马丁·路德·金、甘地、泰勒·斯威夫特' },
  INFP: { name: '调停者', emoji: '🌸', slogan: '世界应该更美好一点。', desc: '理想主义、富有创造力、忠于自我。你有丰富的内心世界，对美和意义有独特感知。外表平静，内心戏极多，最怕被迫违背自己的价值观。', famous: '托尔金、梵高、约翰·列侬' },

const DIM_NAMES = { EI: ['外向 E', '内向 I'], SN: ['感觉 S', '直觉 N'], TF: ['思考 T', '情感 F'], JP: ['判断 J', '感知 P'] }
const DIMS = ['EI', 'SN', 'TF', 'JP']
let scores = { EI: 0, SN: 0, TF: 0, JP: 0 }
let counts = { EI: 0, SN: 0, TF: 0, JP: 0 }
let curIdx = 0
let answers = []

function startTest() {
  scores = { EI: 0, SN: 0, TF: 0, JP: 0 }
  counts = { EI: 0, SN: 0, TF: 0, JP: 0 }
  curIdx = 0
  answers = new Array(QUESTIONS.length).fill(-1)
  showScreen('screen-test')
  renderQ()
}

function renderQ() {
  const q = QUESTIONS[curIdx]
  document.getElementById('q-text').textContent = q.text
  document.getElementById('q-cur').textContent = curIdx + 1
  document.getElementById('q-total').textContent = QUESTIONS.length
  document.getElementById('q-dim').textContent = DIM_NAMES[q.dim][0] + ' vs ' + DIM_NAMES[q.dim][1]
  document.getElementById('progress-fill').style.width = (curIdx / QUESTIONS.length * 100) + '%'

  const wrap = document.getElementById('options-wrap')
  wrap.innerHTML = q.opts.map((opt, i) => `
    <div class="opt ${answers[curIdx] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
      <div class="opt-label">${String.fromCharCode(65 + i)}</div>
      <div class="opt-text">${opt}</div>
    </div>
  `).join('')
}

function selectOpt(idx) {
  const q = QUESTIONS[curIdx]
  const prev = answers[curIdx]
  if (prev !== -1) { scores[q.dim] -= q.scores[prev]; counts[q.dim]-- }
  answers[curIdx] = idx
  scores[q.dim] += q.scores[idx]
  counts[q.dim]++

  document.querySelectorAll('.opt').forEach((el, i) => el.classList.toggle('selected', i === idx))
  setTimeout(() => {
    if (curIdx < QUESTIONS.length - 1) { curIdx++; renderQ() }
    else showResult()
  }, 200)
}

function showResult() {
  // 每个维度：score > count 取第一个字母，否则取第二个
  const E = scores.EI > counts.EI ? 'E' : 'I'
  const S = scores.SN > counts.SN ? 'S' : 'N'
  const T = scores.TF > counts.TF ? 'T' : 'F'
  const J = scores.JP > counts.JP ? 'J' : 'P'
  const code = E + S + T + J
  const t = TYPES[code] || TYPES['INFP']

  document.getElementById('r-emoji').textContent = t.emoji
  document.getElementById('r-code').textContent = code
  document.getElementById('r-name').textContent = t.name
  document.getElementById('r-slogan').textContent = '"' + t.slogan + '"'
  document.getElementById('r-desc').textContent = t.desc
  document.getElementById('r-famous').textContent = '✨ ' + t.famous

  // 四维条形图
  const barsEl = document.getElementById('dim-bars')
  const dimData = [
    { dim: 'EI', left: 'E 外向', right: 'I 内向', pct: Math.round(scores.EI / (counts.EI * 2) * 100) },
    { dim: 'SN', left: 'S 感觉', right: 'N 直觉', pct: Math.round(scores.SN / (counts.SN * 2) * 100) },
    { dim: 'TF', left: 'T 思考', right: 'F 情感', pct: Math.round(scores.TF / (counts.TF * 2) * 100) },
    { dim: 'JP', left: 'J 判断', right: 'P 感知', pct: Math.round(scores.JP / (counts.JP * 2) * 100) }
  ]
  barsEl.innerHTML = dimData.map(d => `
    <div class="dim-row">
      <div class="dim-labels">
        <span class="dim-l">${d.left} ${d.pct}%</span>
        <span class="dim-r">${d.right} ${100 - d.pct}%</span>
      </div>
      <div class="dim-track"><div class="dim-fill" style="width:0%" data-pct="${d.pct}"></div></div>
    </div>
  `).join('')

  showScreen('screen-result')
  setTimeout(() => {
    document.querySelectorAll('.dim-fill').forEach(el => { el.style.width = el.dataset.pct + '%' })
  }, 100)

  try { wx.miniProgram.postMessage({ data: { result: `我的MBTI是${t.emoji}${code} ${t.name}` } }) } catch(e) {}
  setTimeout(() => generateShareImg(t, code), 400)
}

function generateShareImg(t, code) {
  const canvas = document.createElement('canvas')
  const W = 750, H = 1000
  canvas.width = W; canvas.height = H
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, W, H)
  const grd = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, H*0.55)
  grd.addColorStop(0, '#ce93d840'); grd.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H)
  ctx.fillStyle = '#1a1a1a'; roundRect(ctx, 30, 30, W-60, H-60, 36); ctx.fill()

  ctx.font = '130px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText(t.emoji, W/2, 195)

  ctx.fillStyle = '#ce93d822'; roundRect(ctx, W/2-100, 270, 200, 52, 26); ctx.fill()
  ctx.strokeStyle = '#ce93d855'; ctx.lineWidth = 1; roundRect(ctx, W/2-100, 270, 200, 52, 26); ctx.stroke()
  ctx.font = 'bold 28px monospace'; ctx.fillStyle = '#ce93d8'
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(code, W/2, 296)

  ctx.font = 'bold 72px sans-serif'; ctx.fillStyle = '#fff'
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t.name, W/2, 390)

  ctx.font = '28px sans-serif'; ctx.fillStyle = '#888'
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'
  wrapText(ctx, `"${t.slogan}"`, W/2, 445, W-120, 42, 'center')

  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.moveTo(60, H-130); ctx.lineTo(W-60, H-130); ctx.stroke()
  ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#ce93d8'
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('测多多', 60, H-90)
  ctx.font = '22px sans-serif'; ctx.fillStyle = '#555'
  ctx.fillText('更多有趣测试，扫码来玩', 60, H-58)
  ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#444'
  ctx.textAlign = 'right'; ctx.fillText('扫码测试', W-60, H-74)

  const dataUrl = canvas.toDataURL('image/png')
  document.getElementById('share-generating').style.display = 'none'
  document.getElementById('share-img').src = dataUrl
  document.getElementById('share-img-area').style.display = 'block'
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y)
  ctx.arcTo(x+w, y, x+w, y+r, r); ctx.lineTo(x+w, y+h-r)
  ctx.arcTo(x+w, y+h, x+w-r, y+h, r); ctx.lineTo(x+r, y+h)
  ctx.arcTo(x, y+h, x, y+h-r, r); ctx.lineTo(x, y+r)
  ctx.arcTo(x, y, x+r, y, r); ctx.closePath()
}
function wrapText(ctx, text, x, y, maxW, lineH, align) {
  ctx.textAlign = align || 'left'; let line = '', curY = y
  for (const ch of text) {
    const test = line + ch
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, curY); line = ch; curY += lineH }
    else { line = test }
  }
  if (line) ctx.fillText(line, x, curY)
}

function retry() { showScreen('screen-home') }
function goHome() {
  try { wx.miniProgram.switchTab({ url: '/pages/more/more' }) } catch(e) { history.back() }
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
  document.getElementById(id).classList.add('active')
  window.scrollTo(0, 0)
}
</script>
